# 13–16 GB RAM machines: 8G heap + 4G metaspace often OOMs the Gradle daemon on Windows.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true
