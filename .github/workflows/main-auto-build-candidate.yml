name: Main Auto Build Candidate

on:
  push:
    branches:
      - main
    paths:
      - "english_for_community/lib/**"
      - "english_for_community/android/**"
      - "english_for_community/pubspec.yaml"
      - "english_for_community/pubspec.lock"

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: english_for_community
        run: flutter pub get

      - name: Auto bump app version for CI build
        id: version
        working-directory: english_for_community
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_LINE=$(awk -F': ' '/^version:/ {print $2}' pubspec.yaml)
          if [ -z "$VERSION_LINE" ]; then
            echo "Cannot read version from pubspec.yaml"
            exit 1
          fi

          BASE_VERSION_NAME=${VERSION_LINE%%+*}
          BASE_VERSION_CODE=${VERSION_LINE##*+}
          if ! [[ "$BASE_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "Invalid versionCode in pubspec.yaml: $BASE_VERSION_CODE"
            exit 1
          fi

          # Keep versionName stable, generate unique monotonically increasing
          # versionCode per CI run to avoid candidate/version collisions.
          NEW_VERSION_NAME="$BASE_VERSION_NAME"
          NEW_VERSION_CODE=$((BASE_VERSION_CODE + GITHUB_RUN_NUMBER))
          export NEW_VERSION_NAME
          export NEW_VERSION_CODE

          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("pubspec.yaml")
          text = path.read_text(encoding="utf-8")
          name = os.environ["NEW_VERSION_NAME"]
          code = os.environ["NEW_VERSION_CODE"]
          new_line = f"version: {name}+{code}"
          updated = re.sub(r"^version:\s*.+$", new_line, text, count=1, flags=re.MULTILINE)
          if updated == text:
              raise SystemExit("Could not update version line in pubspec.yaml")
          path.write_text(updated, encoding="utf-8")
          PY

          echo "version_name=${NEW_VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${NEW_VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "Using CI build version: ${NEW_VERSION_NAME}+${NEW_VERSION_CODE}"
        shell: bash

      - name: Prepare dictionary asset for CI
        working-directory: english_for_community
        run: |
          if [ -f assets/db/dictionary.db ]; then
            echo "dictionary.db found."
            exit 0
          fi

          if [ -f assets/db/dictionary.rar ]; then
            echo "dictionary.db missing, extracting from dictionary.rar..."
            sudo apt-get update
            sudo apt-get install -y unar
            unar -f -o assets/db assets/db/dictionary.rar
          fi

          if [ ! -f assets/db/dictionary.db ]; then
            echo "Missing dictionary asset. Need assets/db/dictionary.db or assets/db/dictionary.rar"
            exit 1
          fi

      - name: Run tests
        working-directory: english_for_community
        run: flutter test

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing Android signing secrets"
            exit 1
          fi

          mkdir -p english_for_community/android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > english_for_community/android/app/release-key.jks
          cat > english_for_community/android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release-key.jks
          EOF

      - name: Build APK (release, universal multi-ABI)
        working-directory: english_for_community
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --dart-define-from-file=config/prod.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: e4c-android-v${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}.apk
          path: english_for_community/build/app/outputs/flutter-apk/app-release.apk

      # Public HTTPS URL for in-app "Cập nhật ngay" (không cần CH Play).
      # Host APK on GitHub Release asset (free, no extra storage billing setup).
      - name: Upload APK to GitHub Release (downloadUrl for users)
        id: apk_host
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -e
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::Missing GITHUB_TOKEN in workflow environment."
            exit 1
          fi
          APK_PATH="english_for_community/build/app/outputs/flutter-apk/app-release.apk"
          ASSET_NAME="e4c-android-v${VERSION_NAME}_${VERSION_CODE}.apk"
          ASSET_PATH="/tmp/${ASSET_NAME}"
          TAG="auto-v${VERSION_NAME}-build${VERSION_CODE}"
          RELEASE_TITLE="Auto APK v${VERSION_NAME} (${VERSION_CODE})"

          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::GitHub CLI (gh) is not available on runner."
            exit 1
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          else
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${RELEASE_TITLE}" --notes "Auto build from main (${GITHUB_SHA})" --prerelease
          fi

          cp "${APK_PATH}" "${ASSET_PATH}"
          gh release upload "${TAG}" "${ASSET_PATH}" --repo "${GITHUB_REPOSITORY}" --clobber

          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET_NAME}"
          echo "GitHub Release upload success: ${ASSET_NAME}"
          echo "download_url=${DOWNLOAD_URL}" >> "$GITHUB_OUTPUT"

      - name: Create release candidate in backend
        env:
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
          CI_RELEASE_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          DOWNLOAD_URL: ${{ steps.apk_host.outputs.download_url }}
        run: |
          if [ -z "$BACKEND_BASE_URL" ] || [ -z "$CI_RELEASE_TOKEN" ]; then
            echo "Missing BACKEND_BASE_URL or CI_RELEASE_TOKEN secret"
            exit 1
          fi

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Missing DOWNLOAD_URL from GitHub Release step"
            exit 1
          fi

          CHANGELOG="Auto candidate from main commit ${GITHUB_SHA}"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          HTTP_CODE=$(curl -sS -o /tmp/ci_release_candidate_response.json -w "%{http_code}" -X POST "${BACKEND_BASE_URL}/api/app/releases/ci-candidates" \
            -H "Content-Type: application/json" \
            -H "x-ci-token: ${CI_RELEASE_TOKEN}" \
            --data "{
              \"platform\": \"android\",
              \"environment\": \"production\",
              \"versionName\": \"${VERSION_NAME}\",
              \"versionCode\": ${VERSION_CODE},
              \"minSupportedVersionCode\": ${VERSION_CODE},
              \"updateType\": \"soft\",
              \"buildSource\": \"main\",
              \"gitSha\": \"${GITHUB_SHA}\",
              \"gitBranch\": \"${GITHUB_REF_NAME}\",
              \"ciRunId\": \"${GITHUB_RUN_ID}\",
              \"artifactUrlApk\": \"${RUN_URL}\",
              \"downloadUrl\": \"${DOWNLOAD_URL}\",
              \"changelog\": \"${CHANGELOG}\"
            }")

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "Create release candidate failed with HTTP ${HTTP_CODE}"
            cat /tmp/ci_release_candidate_response.json
            exit 1
          fi

          echo "Create release candidate success (HTTP ${HTTP_CODE})"
          cat /tmp/ci_release_candidate_response.json
