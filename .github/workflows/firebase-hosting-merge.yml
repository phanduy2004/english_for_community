name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
    paths:
      - "english_for_community/lib/**"
      - "english_for_community/web/**"
      - "english_for_community/assets/**"
      - "english_for_community/pubspec.yaml"
      - "english_for_community/pubspec.lock"
      - "english_for_community/config/prod.json"
      - "english_for_community/firebase.json"
      - "english_for_community/.firebaserc"
      - ".github/workflows/firebase-hosting-merge.yml"
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  deployments: write

jobs:
  build_and_deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.head_commit != null &&
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]')
      )
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: english_for_community

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - name: Ensure dictionary asset exists for web CI
        run: |
          mkdir -p assets/db
          if [ ! -f assets/db/dictionary.db ]; then
            echo "CI placeholder dictionary asset" > assets/db/dictionary.db
          fi
      - run: flutter build web --release --dart-define-from-file=config/prod.json

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ENGLISH4COMMUNITY_4C654 }}
          projectId: english4community-4c654
          channelId: live
          entryPoint: english_for_community
