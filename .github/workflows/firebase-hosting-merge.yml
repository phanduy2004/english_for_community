name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main  # Hoặc master tùy nhánh của bạn
permissions:
  checks: write
  contents: read
  deployments: write
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get
      - run: flutter build web --release

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_TOKEN }} # Dùng Token cho đơn giản
          projectId: english4community-4c654
          channelId: live
